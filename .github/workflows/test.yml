name: CI

# CI for ELOT.  On every push / pull request:
#   - `test`  : byte-compile, the full ERT suite, and the load smoke
#               test on Linux.  ROBOT-gated tests skip cleanly here
#               (no Java / ROBOT installed).
#   - `robot` : the SAME ERT suite with ELOT_REQUIRE_ROBOT=1, on a
#               runner that has Java + ROBOT installed, so the
#               ROBOT-gated tests execute (and fail loudly if ROBOT is
#               broken) rather than skipping.
#   - `lint`  : package-lint, stripping the two documented
#               with-eval-after-load warnings.
#
# Windows CI is deliberately deferred to post-v1 (MSYS2 is the
# supported Windows path; a bare windows-latest runner lacks the Unix
# tooling the ROBOT wrapper assumes).

on:
  push:
    branches: [main, elpa-submission, elot-gptel-0.1]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Emacs ${{ matrix.emacs_version }} (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ["30.1"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Show Emacs version
        run: emacs --version

      - name: Byte-compile
        run: make byte-compile

      - name: Run ERT suite
        run: make test

      - name: Load smoke test
        run: make smoke

  robot:
    name: ERT suite with ROBOT (ELOT_REQUIRE_ROBOT=1)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: "30.1"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install ROBOT
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -L -o "$HOME/.local/bin/robot.jar" \
            https://github.com/ontodev/robot/releases/latest/download/robot.jar
          curl -L -o "$HOME/.local/bin/robot" \
            https://raw.githubusercontent.com/ontodev/robot/master/bin/robot
          chmod +x "$HOME/.local/bin/robot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show ROBOT version
        run: robot --version

      - name: Run ERT suite with ROBOT gate
        # Same suite as the `test` job, but ELOT_REQUIRE_ROBOT=1 turns
        # the ROBOT `skip-unless' guards into hard failures, so the
        # bucket-3 ROBOT-gated tests execute (and fail loudly if ROBOT
        # is present but broken) instead of silently skipping.
        env:
          ELOT_REQUIRE_ROBOT: "1"
        run: make test

  lint:
    name: package-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Emacs
        uses: purcell/setup-emacs@master
        with:
          version: "30.1"

      - name: Run package-lint
        # `package-lint-batch-and-exit' exits non-zero on any warning or
        # error.  ELOT has two intentional `with-eval-after-load' warnings
        # documented at the source as cross-module load-order bridges
        # (see Milestone 5 Step 5.6 in ELPA-SUBMISSION-PLAN.org).  We
        # capture the lint output, strip those two known-acceptable
        # warning lines, and fail only if anything else remains.
        run: |
          set +e
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(unless (package-installed-p 'package-lint) (package-refresh-contents) (package-install 'package-lint))" \
            --eval "(setq package-lint-main-file \"elot-package/elot.el\")" \
            -L elot-package \
            -f package-lint-batch-and-exit \
            elot-package/*.el > lint.out 2>&1
          lint_exit=$?
          set -e
          echo "=== package-lint output ==="
          cat lint.out
          echo "=== end output ==="
          # Keep only actual lint findings ("file.el:LINE:COL: ...").
          # This drops package-install / network chatter that
          # package-lint-batch-and-exit prints around the real findings.
          findings=$(grep -E '^[^ ]+\.el:[0-9]+:[0-9]+:' lint.out || true)
          # Strip the two intentional `with-eval-after-load' warnings
          # documented at the source (Milestone 5 Step 5.6).
          remaining=$(echo "$findings" \
            | grep -vE "with-eval-after-load' is for use in configurations" \
            || true)
          if [ -n "$remaining" ]; then
            echo "=== unexpected lint findings ==="
            echo "$remaining"
            exit 1
          fi
          echo "OK: only the two documented with-eval-after-load warnings present."
          exit 0
